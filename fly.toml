# Carolina Code Conference Fly org: carolina-code-conference
# Public hostname: carolina-codes-php.fly.dev

app = "carolina-codes-php"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  CAROLINA_URL = "http://carolina-codes.internal:8080"
  PUBLIC_BASE_URL = "https://carolina-codes-php.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # One shared CPU runs a single-threaded SAPI. Keep the request
  # soft limit low so Fly does not pile connections onto one process.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
